services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: habit-tracker-api:local
    container_name: habit-tracker-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8081}:8081"
    environment:
      SERVER_PORT: 8081
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError}
